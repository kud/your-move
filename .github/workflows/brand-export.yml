name: Generate brand exports

on:
  push:
    branches:
      - brand/your-move-electric-blue

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rasteriser
        run: npm install --no-save --ignore-scripts=false sharp

      - name: Render brand PNGs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fsp = fs.promises;
          const path = require('path');
          const sharp = require('sharp');

          const VOID = '#0B0C0E';
          const ICE = '#F8FAFC';

          async function render(src, out, width) {
            await fsp.mkdir(path.dirname(out), { recursive: true });
            await sharp(src).resize({ width }).png().toFile(out);
          }

          async function fitBuffer(src, width) {
            return sharp(src).resize({ width }).png().toBuffer();
          }

          async function main() {
            await fsp.mkdir('brand/png', { recursive: true });
            await fsp.mkdir('public/icons', { recursive: true });

            for (const name of ['mark', 'mark-light', 'mark-mono']) {
              await render(`brand/svg/${name}.svg`, `brand/png/${name}-1200.png`, 1200);
            }

            for (const name of ['logo', 'logo-light', 'logo-mono']) {
              await render(`brand/svg/${name}.svg`, `brand/png/${name}-2880.png`, 2880);
            }

            for (const size of [16, 32, 180, 192, 512, 1024]) {
              await render('brand/svg/icon.svg', `brand/png/icon-${size}.png`, size);
            }

            await render('brand/svg/icon-light.svg', 'brand/png/icon-light-512.png', 512);
            await render('brand/svg/icon-maskable.svg', 'brand/png/icon-maskable-512.png', 512);

            const logo = await fitBuffer('brand/svg/logo.svg', 560);
            const logoMeta = await sharp(logo).metadata();
            const og = await sharp({
              create: { width: 1200, height: 630, channels: 4, background: VOID },
            }).composite([{
              input: logo,
              left: 320,
              top: Math.round((630 - logoMeta.height) / 2),
            }]).png().toBuffer();

            await fsp.writeFile('brand/png/og-1200x630.png', og);
            await fsp.writeFile('app/opengraph-image.png', og);

            const previewLogo = await fitBuffer('brand/svg/logo.svg', 1120);
            const previewLogoMeta = await sharp(previewLogo).metadata();
            const lightMark = await fitBuffer('brand/svg/mark-light.svg', 420);
            const lightMarkMeta = await sharp(lightMark).metadata();
            const icon = await fitBuffer('brand/svg/icon.svg', 250);

            const lightBand = await sharp({
              create: { width: 1600, height: 340, channels: 4, background: ICE },
            }).png().toBuffer();

            const preview = await sharp({
              create: { width: 1600, height: 900, channels: 4, background: VOID },
            }).composite([
              { input: lightBand, left: 0, top: 560 },
              { input: previewLogo, left: 240, top: 120 },
              { input: lightMark, left: 260, top: 585 },
              { input: icon, left: 1080, top: 605 },
            ]).png().toBuffer();

            await fsp.writeFile('brand/preview.png', preview);

            await fsp.copyFile('brand/png/icon-180.png', 'public/icons/apple-touch-icon.png');
            await fsp.copyFile('brand/png/icon-192.png', 'public/icons/icon-192.png');
            await fsp.copyFile('brand/png/icon-512.png', 'public/icons/icon-512.png');
            await fsp.copyFile('brand/png/icon-maskable-512.png', 'public/icons/icon-maskable-512.png');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/png brand/preview.png public/icons app/opengraph-image.png
          git diff --cached --quiet || git commit -m "🎨 chore(brand): regenerate PNG exports"
          git push

      - name: Remove temporary generator
        run: |
          git rm .github/workflows/brand-export.yml
          git commit -m "🧹 chore(brand): remove temporary export workflow"
          git push
